<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071426">
  <meta name="description" content="配送・物流・安全・法令・冷凍冷蔵の最新ニュースを確認できる業務向けニュースアプリ">
  <title>配送業界 NEWS BOARD</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="配送業界ニュース トップ">
      <span class="brand-mark">D</span>
      <span><b>配送業界</b><small>NEWS BOARD</small></span>
    </a>
    <div class="update-state"><span class="pulse"></span><span id="updatedAt">更新日時を確認中</span></div>
  </header>

  <main>
    <section class="headline">
      <div>
        <p class="eyebrow">LOGISTICS INTELLIGENCE</p>
        <h1>現場に必要なニュースを、<br><em>すばやく。</em></h1>
      </div>
      <div class="summary-card">
        <span>掲載記事</span><strong id="totalCount">--</strong><small>件</small>
      </div>
    </section>

    <section class="controls" aria-label="記事の絞り込み">
      <label class="search">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="キーワードで検索" autocomplete="off">
      </label>
      <button id="refreshBtn" class="refresh" type="button">↻ 最新情報を確認</button>
    </section>

    <nav id="categoryTabs" class="tabs" aria-label="ニュースカテゴリー">
      <button class="active" data-category="すべて">すべて</button>
      <button data-category="物流">物流</button>
      <button data-category="安全・事故">安全・事故</button>
      <button data-category="法令・行政">法令・行政</button>
      <button data-category="冷凍・冷蔵">冷凍・冷蔵</button>
      <button data-category="道路・交通">道路・交通</button>
      <button data-category="お気に入り">★ お気に入り</button>
    </nav>

    <section class="section-head">
      <div><span id="sectionKicker">LATEST</span><h2 id="sectionTitle">最新ニュース</h2></div>
      <span id="resultCount" class="result-count"></span>
    </section>

    <section id="newsGrid" class="news-grid" aria-live="polite"></section>
    <div id="emptyState" class="empty" hidden><b>該当する記事がありません</b><span>検索条件やカテゴリーを変更してください。</span></div>
  </main>

  <template id="cardTemplate">
    <article class="news-card">
      <div class="card-meta"><span class="category"></span><time></time></div>
      <h3></h3>
      <p class="description"></p>
      <div class="card-foot">
        <span class="source"></span>
        <div class="actions">
          <button class="favorite" type="button" aria-label="お気に入りに追加">☆</button>
          <a class="read" target="_blank" rel="noopener noreferrer">記事を読む <span>↗</span></a>
        </div>
      </div>
    </article>
  </template>

  <footer><span>配送業界 NEWS BOARD</span><small>記事の著作権は各配信元に帰属します。</small></footer>
  <script src="assets/app.js" defer></script>
</body>
</html>
